# Medallion (NY Taxi) Palette for Dunst

[global]
    frame_width = 2
    frame_color = "#f5b700"
    font = JetBrainsMono Nerd Font 11

[urgency_low]
    background = "#101214"
    foreground = "#6e7681"
    frame_color = "#23272e"

[urgency_normal]
    background = "#101214"
    foreground = "#e6e8eb"
    frame_color = "#f5b700"
    highlight = "#f5b700"

[urgency_critical]
    background = "#181a1d"
    foreground = "#ffffff"
    frame_color = "#e06c75"
    highlight = "#e06c75"
