# Medallion (NY Taxi) Palette for tmux

set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"
set -sa terminal-features ",st-256color:RGB,xterm-256color:RGB"
set -sa terminal-overrides ",st-256color:Tc,xterm-256color:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -sg escape-time 10
set -g focus-events on
set -g history-limit 20000
set -g mouse on

# Statusline Styling
set -g status-position bottom
set -g status-style "bg=#101214,fg=#e6e8eb"
set -g status-left "#[fg=#f5b700,bold][#S] "
set -g status-right "#[fg=#6e7681]%R "
set -g window-status-current-format "#[fg=#101214,bg=#f5b700,bold] #I #W #[default]"
set -g window-status-format "#[fg=#6e7681,bg=#101214] #I #W "
set -g pane-border-style "fg=#23272e"
set -g pane-active-border-style "fg=#f5b700"

# Vi mode & clipboard integration
set-window-option -g mode-keys vi
set -s set-clipboard on
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
